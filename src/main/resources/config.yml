# BetterEnderChest configuration
# Author: Linsaftw
# Pages hold 5 rows of storage plus 1 control row.

storage:
  default-rows: 3
  tiers:
    special:
      permission: betterenderchest.rows.special
      rows: 6
    mvp:
      permission: betterenderchest.rows.mvp
      rows: 10
    elite:
      permission: betterenderchest.rows.elite
      rows: 15
    mythical:
      permission: betterenderchest.rows.mythical
      rows: 20
    celestial:
      permission: betterenderchest.rows.celestial
      rows: 25
    immortal:
      permission: betterenderchest.rows.immortal
      rows: 30
    patron:
      permission: betterenderchest.rows.patron
      rows: 35

enderchest:
  title: "<dark_gray>Better Ender Chest (Page {page}/{pages})</dark_gray>"
  auto-save: true
  save-interval-seconds: 300

controls:
  filler:
    material:
      modern: GRAY_STAINED_GLASS_PANE
      legacy: STAINED_GLASS_PANE
      legacy-data: 7
    name: "<gray> </gray>"
    lore: []
  previous-page:
    material:
      modern: ARROW
      legacy: ARROW
      legacy-data: -1
    name: "<green>Previous Page</green>"
    lore:
      - "<gray>Go to page <white>{page}</white></gray>"
  page-info:
    material:
      modern: ENDER_CHEST
      legacy: ENDER_CHEST
      legacy-data: -1
    name: "<green>Page {page}/{pages}</green>"
    lore:
      - "<gray>Current page indicator</gray>"
  next-page:
    material:
      modern: ARROW
      legacy: ARROW
      legacy-data: -1
    name: "<green>Next Page</green>"
    lore:
      - "<gray>Go to page <white>{page}</white></gray>"

messages:
  enderchest-opened: "&7Opening your enderchest..."
  admin-enderchest-opened: "&7Opening &e{player}'s &7enderchest..."
  player-not-found: "&cPlayer '{player}' not found or never played before!"
  no-permission: "&cYou don't have permission to use this command!"
  error-loading: "&cError loading enderchest data!"
  error-saving: "&cError saving enderchest data!"
  data-saved: "&aEnderchest data saved successfully!"
  player-only: "&cOnly players can use this command."
  admin-usage: "&cUsage: /ecadmin <player> [clear|view]"
  admin-chest-cleared: "&aCleared {player}'s enderchest."
  admin-clear-busy: "&cCannot clear {player}'s enderchest while it is open or loading. Close it and retry."
  bec-header: "<green>BetterEnderChest <white>v{version}</white> by <yellow>LinsaFTW</yellow></green>"
  bec-reload-entry: "<yellow>reload</yellow> <gray>- <white>Reload the configuration</white></gray>"
  bec-reloaded: "<green>Configuration reloaded.</green>"
  bec-unknown-subcommand: "<red>Unknown subcommand. Use /betterenderchest for help.</red>"

debug: false
